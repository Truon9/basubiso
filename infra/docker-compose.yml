services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: learnly
      POSTGRES_USER: learnly
      POSTGRES_PASSWORD: learnly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnly -d learnly"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
